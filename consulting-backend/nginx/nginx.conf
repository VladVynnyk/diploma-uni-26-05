upstream backend {
    server api:8000;
}

server {
    listen 80;
    listen [::]:80;
    
    # server_name 18.159.97.152; # здесь прописать или IP-адрес или доменное имя сервера
    server_name api.poradnyky.shop www.api.poradnyky.shop;
    access_log  /var/log/nginx/example.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
 
    location / {
        proxy_pass http://backend;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header Host $host;
        # proxy_redirect off;

        #rewrite ^ https://$host$request_uri? permanent;
        #return 301 https://api.poradnyky.shop$request_uri;
        return 301 https://$host$request_uri;
    }
}

server {
    #listen 443 ssl http2;
    #listen [::]:443 ssl http2;
    listen 443 ssl;
    http2 on;

    server_name api.poradnyky.shop;

    ssl_certificate /etc/letsencrypt/live/api.poradnyky.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.poradnyky.shop/privkey.pem;
    
    location / {
    	#proxy_pass http://api.poradnyky.shop;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
}