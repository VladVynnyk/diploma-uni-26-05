version: "3.9"
services:
  api:
    build: .
    ports: 
      - "8000:8000"
    volumes: 
      - backend_api:/backend/core
    env_file:
      - .env
    environment:
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      - db 
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=consultingdb

  redis:
    image: redis:latest
    restart: always
    ports: 
      - "6379:6379"
    volumes:
      - /path/to/local/dаta:/root/redis
      - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=my-password
      - REDIS_PORT=6379

volumes:
  postgres_data:
  backend_api:
